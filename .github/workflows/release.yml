name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cpp:
    name: Build C++ Standalone Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: printemps-linux
          - os: macos-latest
            artifact_name: printemps-macos
          - os: windows-latest
            artifact_name: printemps-windows.exe
    steps:
      - uses: actions/checkout@v6

      - name: Configure CMake
        run: |
          mkdir build_app
          cmake -S cmake/application -B build_app -DCMAKE_BUILD_TYPE=Release -DTOP_DIR=${{ github.workspace }} -DCPU_ARCH=none

      - name: Build
        run: cmake --build build_app --config Release --parallel 4

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp build_app/printemps ./printemps
          tar -czf ${{ matrix.artifact_name }}.tar.gz printemps

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp build_app/Release/printemps.exe ./printemps.exe
          compress-archive -Path printemps.exe -DestinationPath ${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build Python Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip build

      - name: Vendor C++ headers and build sdist
        run: |
          cd python
          python tools/vendor.py
          python -m build --sdist

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wheels:
    name: Build Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build and cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Vendor C++ headers
        run: |
          cd python
          python tools/vendor.py

      - name: Build wheels using cibuildwheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse python

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
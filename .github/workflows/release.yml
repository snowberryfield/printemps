name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cpp:
    name: Build C++ Standalone Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: macos-latest
            os_name: macos
          - os: windows-latest
            os_name: windows
    steps:
      - uses: actions/checkout@v6

      - name: Configure CMake
        shell: bash
        run: |
          mkdir build_app
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cmake -S cmake/application -B build_app -DCMAKE_BUILD_TYPE=Release -DTOP_DIR=${{ github.workspace }} -DCPU_ARCH=none -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          else
            cmake -S cmake/application -B build_app -DCMAKE_BUILD_TYPE=Release -DTOP_DIR=${{ github.workspace }} -DCPU_ARCH=none
          fi

      - name: Build
        run: cmake --build build_app --config Release --parallel 4

      - name: Set Release Tag
        shell: bash
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          DIR_NAME="printemps-${{ env.RELEASE_TAG }}-${{ matrix.os_name }}"
          mkdir -p "$DIR_NAME"
          cp build_app/printemps "$DIR_NAME/"
          cp LICENSE README.md "$DIR_NAME/"
          tar -czf "${DIR_NAME}.tar.gz" "$DIR_NAME"

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          $dirName = "printemps-${env:RELEASE_TAG}-${{ matrix.os_name }}"
          mkdir "$dirName"
          cp build_app/Release/printemps.exe "$dirName/"
          cp LICENSE, README.md "$dirName/"
          compress-archive -Path "$dirName" -DestinationPath "${dirName}.zip"
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            printemps-*-linux.tar.gz
            printemps-*-macos.tar.gz
            printemps-*-windows.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-headers:
    name: Package C++ Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set Release Tag
        run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Prepare Headers Archive
        run: |
          DIR_NAME="printemps-${{ env.RELEASE_TAG }}-headers"
          mkdir -p "$DIR_NAME"
          cp -r printemps "$DIR_NAME/"
          cp LICENSE README.md "$DIR_NAME/"
          zip -r "${DIR_NAME}.zip" "$DIR_NAME"
          tar -czf "${DIR_NAME}.tar.gz" "$DIR_NAME"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            printemps-*-headers.zip
            printemps-*-headers.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build Python Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip build

      - name: Vendor C++ headers and build sdist
        run: |
          cd python
          python tools/vendor.py
          python -m build --sdist

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wheels:
    name: Build Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build and cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Vendor C++ headers
        run: |
          cd python
          python tools/vendor.py

      - name: Build wheels using cibuildwheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse python

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
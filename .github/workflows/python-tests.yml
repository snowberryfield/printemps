name: Python Tests

on:
  push:
    paths:
      - 'python/**'
      - 'printemps/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'printemps/**'
      - '.github/workflows/python-tests.yml'

jobs:
  test-python:
    name: Python Binding Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build pytest

      - name: Vendor C++ headers and build package
        run: |
          cd python
          python tools/vendor.py
          python -m build

      - name: Install built wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          python -m pip install python/dist/*.whl

      - name: Install built wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install (Get-ChildItem python/dist/*.whl).FullName

      - name: Run pytest
        run: |
          cd python
          pytest tests
